# Name of this GitHub Actions workflow.
name: Semgrep CE Django scan

# Controls when the workflow will run
on:
  # Triggers the workflow on push events but only for the "test-semgrep" branch
  push:
    branches: [ "test-semgrep" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  security-events: write
  contents: read

jobs:
  semgrep:
    # User definable name of this GitHub Actions job.
    name: semgrep-oss/scan-django
    # If you are self-hosting, change the following `runs-on` value: 
    runs-on: ubuntu-latest

    container:
      # A Docker image with Semgrep installed. Do not change this.
      image: semgrep/semgrep

    # Skip any PR created by dependabot to avoid permission issues:
    if: (github.actor != 'dependabot[bot]')

    steps:
      # Fetch project source with GitHub Actions Checkout.
      - name: Checkout repository
        uses: actions/checkout@v4

      # Run the "semgrep scan" command on the command line of the docker image.
      - name: Run Semgrep Scan
        run: |
          semgrep scan \
            --config "p/default" --config "p/python" --config "p/bandit" \
            --sarif \
            --output semgrep-results.sarif \
            --metrics=off

            # 2. Rzutowanie wartości oraz naprawa zbyt długich identyfikatorów (Fix dla limitu 255 znaków oraz wartości Info)
      - name: Post-process SARIF File for GitHub Limits
        if: always()
        shell: python
        run: |
          import json
          import os

          file_path = "semgrep-results.sarif"
          if os.path.exists(file_path):
              with open(file_path, "r") as f:
                  data = json.load(f)
              
              # Dodano "Info" z mapowaniem na "0.0"
              mapping = {
                  "Critical": "9.5",
                  "High": "8.0",
                  "Medium": "5.5",
                  "Low": "2.0",
                  "Info": "0.0"
              }
              
              # Słownik do mapowania starych identyfikatorów na bezpieczne skrócone wersje
              id_map = {}

              for run in data.get("runs", []):
                  # 1. Przetwarzanie definicji reguł (rules)
                  for rule in run.get("tool", {}).get("driver", {}).get("rules", []):
                      rule_id = rule.get("id", "")
                      
                      # Fix dla limitu 255 znaków
                      if len(rule_id) > 255:
                          new_id = rule_id[:240] + "...shortened"
                          id_map[rule_id] = new_id
                          rule["id"] = new_id
                          rule_id = new_id
                      
                      # Fix dla security-severity
                      properties = rule.get("properties", {})
                      if "security-severity" in properties:
                          old_val = str(properties["security-severity"]).strip().capitalize()
                          if old_val in mapping:
                              properties["security-severity"] = mapping[old_val]
              
                  # 2. Przetwarzanie konkretnych wyników (results) i synchronizacja ID
                  for result in run.get("results", []):
                      # Podmiana ID reguły na skróconą wersję, jeśli była za długa
                      old_rule_id = result.get("ruleId", "")
                      if old_rule_id in id_map:
                          result["ruleId"] = id_map[old_rule_id]
                      
                      # Dodatkowy fix dla security-severity w wynikach
                      properties = result.get("properties", {})
                      if "security-severity" in properties:
                          old_val = str(properties["security-severity"]).strip().capitalize()
                          if old_val in mapping:
                              properties["security-severity"] = mapping[old_val]

              with open(file_path, "w") as f:
                  json.dump(data, f, indent=2)
              print("Pomyślnie dostosowano plik SARIF do wymagań GitHub Advanced Security!")

      - name: Upload SARIF file to GitHub
        uses: github/codeql-action/upload-sarif@v3
        # Wykonaj ten krok nawet wtedy, gdy Semgrep znajdzie luki bezpieczeństwa (błędy)
        if: always() 
        with:
          sarif_file: semgrep-results.sarif
